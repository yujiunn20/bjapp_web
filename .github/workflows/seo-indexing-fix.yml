name: One-time SEO indexing cleanup

on:
  push:
    branches:
      - fix/seo-indexing-20260917

permissions:
  contents: write

jobs:
  fix-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize SEO signals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          BASE = "https://blackjack.yuchunlab.com"
          LANGS = ("en", "zh-Hant", "ja")

          # 1) Public navigation should use the same extensionless URLs as canonical/sitemap.
          layout = Path("content/layout.js")
          text = layout.read_text(encoding="utf-8")
          old_active = 'return localizedRoute(path, activeLanguage, { withExtension: true });'
          old_lang = 'return localizedRoute(path, language, { withExtension: true });'
          if old_active not in text or old_lang not in text:
              raise SystemExit("Expected layout.js route patterns were not found; refusing unsafe rewrite")
          text = text.replace(old_active, 'return localizedRoute(path, activeLanguage, { withExtension: false });')
          text = text.replace(old_lang, 'return localizedRoute(path, language, { withExtension: false });')
          layout.write_text(text, encoding="utf-8")

          def route_for(prefix: str, relative: str) -> str:
              no_ext = relative[:-5] if relative.endswith(".html") else relative
              return f"/{prefix}/{no_ext}"

          def normalize_html(path: Path, prefix: str, relative: str, legacy: bool = False) -> None:
              text = path.read_text(encoding="utf-8-sig")

              canonical_prefix = "zh-Hant" if legacy else prefix
              canonical = BASE + route_for(canonical_prefix, relative)
              alternates = {
                  "zh-Hant": BASE + route_for("zh-Hant", relative),
                  "en": BASE + route_for("en", relative),
                  "ja": BASE + route_for("ja", relative),
                  "x-default": BASE + route_for("en", relative),
              }

              # Remove old canonical/hreflang declarations so source HTML has one unambiguous set.
              text = re.sub(r'^\s*<link\s+rel="canonical"[^>]*>\s*\n?', '', text, flags=re.M)
              text = re.sub(r'^\s*<link\s+rel="alternate"\s+hreflang="[^"]+"[^>]*>\s*\n?', '', text, flags=re.M)

              if legacy:
                  # Keep old /content/... pages crawlable for discovery, but never index them as duplicates.
                  if re.search(r'<meta\s+name="robots"', text, flags=re.I):
                      text = re.sub(
                          r'<meta\s+name="robots"\s+content="[^"]*"\s*/?>',
                          '<meta name="robots" content="noindex,follow">',
                          text,
                          count=1,
                          flags=re.I,
                      )
                  else:
                      text = text.replace(
                          '<meta name="viewport" content="width=device-width, initial-scale=1">',
                          '<meta name="viewport" content="width=device-width, initial-scale=1">\n  <meta name="robots" content="noindex,follow">',
                          1,
                      )

              block = (
                  f'  <link rel="canonical" href="{canonical}">\n'
                  f'  <link rel="alternate" hreflang="zh-Hant" href="{alternates["zh-Hant"]}">\n'
                  f'  <link rel="alternate" hreflang="en" href="{alternates["en"]}">\n'
                  f'  <link rel="alternate" hreflang="ja" href="{alternates["ja"]}">\n'
                  f'  <link rel="alternate" hreflang="x-default" href="{alternates["x-default"]}">\n'
              )

              # Insert after description when present; otherwise after viewport.
              desc = re.search(r'^\s*<meta\s+name="description"[^>]*>\s*$', text, flags=re.M)
              if desc:
                  insert_at = desc.end()
                  text = text[:insert_at] + "\n" + block.rstrip("\n") + text[insert_at:]
              else:
                  viewport = re.search(r'^\s*<meta\s+name="viewport"[^>]*>\s*$', text, flags=re.M)
                  if not viewport:
                      raise SystemExit(f"No insertion point in {path}")
                  insert_at = viewport.end()
                  text = text[:insert_at] + "\n" + block.rstrip("\n") + text[insert_at:]

              path.write_text(text, encoding="utf-8")

          # 2) Normalize all translated pages.
          translated = []
          for lang in LANGS:
              root = Path(lang) / "content"
              for path in sorted(root.rglob("*.html")):
                  relative = path.relative_to(lang).as_posix()
                  normalize_html(path, lang, relative, legacy=False)
                  translated.append(path)

          # 3) Keep historical unprefixed Traditional Chinese pages out of the index,
          #    while pointing their canonical/hreflang to the new /zh-Hant/... URLs.
          legacy_root = Path("content")
          legacy_pages = []
          for section in ("app", "cardcounting", "pc"):
              section_root = legacy_root / section
              if not section_root.exists():
                  continue
              for path in sorted(section_root.glob("*.html")):
                  relative = path.as_posix()
                  normalize_html(path, "zh-Hant", relative, legacy=True)
                  legacy_pages.append(path)

          # 4) Rebuild sitemap from the actual canonical translated files only.
          #    Redirect/noindex stubs such as /, /en/, /zh-Hant/, /ja/ are intentionally omitted.
          relative_routes = sorted(
              p.relative_to("en").as_posix()
              for p in (Path("en") / "content").rglob("*.html")
          )

          missing = []
          for relative in relative_routes:
              for lang in LANGS:
                  if not (Path(lang) / relative).exists():
                      missing.append(f"{lang}/{relative}")
          if missing:
              raise SystemExit("Missing translated pages: " + ", ".join(missing))

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:xhtml="http://www.w3.org/1999/xhtml">',
          ]
          for relative in relative_routes:
              for lang in LANGS:
                  loc = BASE + route_for(lang, relative)
                  lines.extend([
                      "  <url>",
                      f"    <loc>{loc}</loc>",
                      f'    <xhtml:link rel="alternate" hreflang="en" href="{BASE + route_for("en", relative)}"/>',
                      f'    <xhtml:link rel="alternate" hreflang="zh-Hant" href="{BASE + route_for("zh-Hant", relative)}"/>',
                      f'    <xhtml:link rel="alternate" hreflang="ja" href="{BASE + route_for("ja", relative)}"/>',
                      f'    <xhtml:link rel="alternate" hreflang="x-default" href="{BASE + route_for("en", relative)}"/>',
                      "  </url>",
                  ])
          lines.append("</urlset>")
          Path("sitemap.xml").write_text("\n".join(lines) + "\n", encoding="utf-8")

          # 5) Sanity checks before committing.
          ET.parse("sitemap.xml")
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          for forbidden in (
              f"<loc>{BASE}/</loc>",
              f"<loc>{BASE}/en/</loc>",
              f"<loc>{BASE}/zh-Hant/</loc>",
              f"<loc>{BASE}/ja/</loc>",
              f"<loc>{BASE}/content/",
          ):
              if forbidden in sitemap:
                  raise SystemExit(f"Forbidden sitemap URL remains: {forbidden}")

          expected_urls = len(relative_routes) * len(LANGS)
          actual_urls = sitemap.count("<url>")
          if actual_urls != expected_urls:
              raise SystemExit(f"Sitemap URL count mismatch: expected {expected_urls}, got {actual_urls}")

          for path in translated:
              raw = path.read_text(encoding="utf-8")
              lang = path.parts[0]
              relative = Path(*path.parts[1:]).as_posix()
              expected_canonical = BASE + route_for(lang, relative)
              if f'<link rel="canonical" href="{expected_canonical}">' not in raw:
                  raise SystemExit(f"Canonical mismatch in {path}")
              expected_zh = BASE + route_for("zh-Hant", relative)
              if f'hreflang="zh-Hant" href="{expected_zh}"' not in raw:
                  raise SystemExit(f"zh-Hant hreflang mismatch in {path}")

          for path in legacy_pages:
              raw = path.read_text(encoding="utf-8")
              relative = path.as_posix()
              expected_canonical = BASE + route_for("zh-Hant", relative)
              if 'meta name="robots" content="noindex,follow"' not in raw:
                  raise SystemExit(f"Legacy noindex missing in {path}")
              if f'<link rel="canonical" href="{expected_canonical}">' not in raw:
                  raise SystemExit(f"Legacy canonical mismatch in {path}")

          updated_layout = layout.read_text(encoding="utf-8")
          if old_active in updated_layout or old_lang in updated_layout:
              raise SystemExit("Extensionful public navigation remains in layout.js")

          print(f"Normalized {len(translated)} translated pages and {len(legacy_pages)} legacy pages")
          print(f"Generated sitemap with {actual_urls} canonical URLs")
          PY

      - name: Commit SEO cleanup and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/seo-indexing-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize SEO canonical indexing signals"
          git push origin HEAD:fix/seo-indexing-20260917
