name: SEO validation
on:
  pull_request:
  push:
    branches:
      - "fix/seo-*"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check sitemap and internal links
        run: |
          node tools/generate-sitemap.js
          git diff --exit-code sitemap.xml
          node tools/check-seo.js
